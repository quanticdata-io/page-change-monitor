# Copy to .github/workflows/monitor.yml in your own repository, next to a monitor.json.
# Add the repository secret QUANTICDATA_API_KEY (Settings > Secrets and variables > Actions),
# and optionally MONITOR_SLACK_WEBHOOK_URL / MONITOR_WEBHOOK_URL.
name: Page change monitor

on:
  schedule:
    - cron: '17 */6 * * *' # every 6 hours; GitHub may delay scheduled runs
  workflow_dispatch:

permissions:
  contents: write # to commit the snapshots

concurrency:
  group: page-change-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: monitor
        uses: quanticdata-io/page-change-monitor@main
        with:
          config: monitor.json
          snapshots: snapshots
          api-key: ${{ secrets.QUANTICDATA_API_KEY }}
          slack-webhook: ${{ secrets.MONITOR_SLACK_WEBHOOK_URL }}
          webhook: ${{ secrets.MONITOR_WEBHOOK_URL }}

      - name: Commit snapshots
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "Update page snapshots"
            git push
          fi
